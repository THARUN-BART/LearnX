openapi: 3.0.3
info:
  title: LearnX Backend API
  version: 1.1.0
  description: Authentication plus Striver A2Z DSA roadmap, problem catalogue, student progress, and analytics.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is running
  /api/v1/roadmaps:
    get:
      security: [{bearerAuth: []}]
      summary: List active DSA roadmaps
      responses:
        "200":
          description: Roadmap catalogue
  /api/v1/roadmaps/{roadmap_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: roadmap_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Roadmap details}
  /api/v1/roadmaps/{roadmap_id}/topics:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: roadmap_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Ordered topics}
  /api/v1/topics/{topic_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: topic_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Topic details}
  /api/v1/topics/{topic_id}/subtopics:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: topic_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Ordered subtopics}
  /api/v1/problems:
    get:
      security: [{bearerAuth: []}]
      summary: List or filter problems
      parameters:
        - in: query
          name: q
          schema: {type: string}
        - in: query
          name: difficulty
          schema: {type: string, enum: [Easy, Medium, Hard, Unspecified]}
        - in: query
          name: topic_id
          schema: {type: string, format: uuid}
        - in: query
          name: subtopic_id
          schema: {type: string, format: uuid}
        - in: query
          name: status
          schema: {type: string, enum: [Not Started, Attempted, Solved, Needs Revision]}
        - in: query
          name: page
          schema: {type: integer, default: 1}
        - in: query
          name: limit
          schema: {type: integer, default: 20, maximum: 100}
        - in: query
          name: sort
          schema: {type: string, enum: [problem_order, title]}
      responses:
        "200": {description: Paginated problems}
  /api/v1/problems/search:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string, example: two-sum}
      responses:
        "200": {description: Search hits}
  /api/v1/problems/{problem_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Problem plus related items}
  /api/v1/subtopics/{subtopic_id}/problems:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: subtopic_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Problems in a subtopic}
  /api/v1/student/progress:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current student progress rows}
  /api/v1/student/progress/summary:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Roadmap progress summary}
  /api/v1/student/progress/topics:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Topic-wise progress}
  /api/v1/student/progress/problems/{problem_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Single problem progress}
  /api/v1/student/progress/problems/{problem_id}/attempt:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Marked attempted}
  /api/v1/student/progress/problems/{problem_id}:
    patch:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Not Started, Attempted, Solved, Needs Revision]
                reset:
                  type: boolean
      responses:
        "200": {description: Progress updated}
  /api/v1/student/analytics/overview:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Overall progress}
  /api/v1/student/analytics/topics:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Topic analytics}
  /api/v1/student/analytics/difficulty:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Difficulty analytics}
  /api/v1/student/analytics/activity:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: days
          schema: {type: integer, default: 30, maximum: 90}
      responses:
        "200": {description: Recent activity}
  /api/v1/submissions:
    post:
      security: [{bearerAuth: []}]
      summary: Submit solution for code assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problem_id, language, source_code]
              properties:
                problem_id: {type: string, format: uuid}
                language: {type: string, enum: [c, cpp, java, python, go]}
                source_code: {type: string}
      responses:
        "202":
          description: Submission queued for background assessment
        "400":
          description: Invalid request or unsupported language
  /api/v1/submissions/{submission_id}:
    get:
      security: [{bearerAuth: []}]
      summary: Retrieve submission status and execution metrics
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Submission summary
        "403":
          description: Unauthorized access to another student's submission
        "404":
          description: Submission not found
  /api/v1/submissions/{submission_id}/result:
    get:
      security: [{bearerAuth: []}]
      summary: Retrieve detailed assessment result (with hidden test data sanitized)
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Detailed test-case execution results
  /api/v1/submissions/{submission_id}/retry:
    post:
      security: [{bearerAuth: []}]
      summary: Re-queue a failed or interrupted submission
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Submission re-queued
  /api/v1/student/submissions:
    get:
      security: [{bearerAuth: []}]
      summary: Get authenticated student submission history
      parameters:
        - in: query
          name: problem_id
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: page
          schema: {type: integer, default: 1}
        - in: query
          name: limit
          schema: {type: integer, default: 20}
      responses:
        "200":
          description: Paginated submissions list
  /api/v1/problems/{problem_id}/submissions:
    get:
      security: [{bearerAuth: []}]
      summary: Get submissions for a specific problem
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
        - in: query
          name: page
          schema: {type: integer, default: 1}
        - in: query
          name: limit
          schema: {type: integer, default: 20}
      responses:
        "200":
          description: Problem submissions list
  /api/v1/problems/{problem_id}/submissions/latest:
    get:
      security: [{bearerAuth: []}]
      summary: Get the latest submission for a problem
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Latest problem submission summary
  /api/v1/problems/{problem_id}/testcases/sample:
    get:
      security: [{bearerAuth: []}]
      summary: Retrieve sample (non-hidden) test cases for a problem
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: List of sample test cases
  /api/v1/admin/problems/{problem_id}/testcases:
    post:
      security: [{bearerAuth: []}]
      summary: Create a test case (admin operation)
      parameters:
        - in: path
          name: problem_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input_data, expected_output]
              properties:
                input_data: {type: string}
                expected_output: {type: string}
                is_hidden: {type: boolean, default: false}
                test_order: {type: integer, default: 1}
      responses:
        "201":
          description: Test case created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
